<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập hệ thống</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #064e3b; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: #ffffff; width: 100%; max-width: 420px; border-radius: 16px; padding: 36px 30px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
        .auth-header { text-align: center; margin-bottom: 24px; }
        .auth-header h2 { font-size: 24px; color: #064e3b; margin-top: 8px; font-weight: 800; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        .input-wrap { position: relative; }
        .input-wrap i { position: absolute; left: 14px; top: 12px; color: #9ca3af; }
        .input-wrap input { width: 100%; padding: 10px 14px 10px 38px; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 14px; outline: none; }
        .input-wrap input:focus { border-color: #059669; }
        .btn-auth { width: 100%; background: #059669; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
        .btn-auth:hover { background: #047857; }
        .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
        .alert-error { background: #fee2e2; color: #b91c1c; }
        .alert-success { background: #dcfce7; color: #15803d; }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: #6b7280; }
        .auth-footer a { color: #059669; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <i class="fa-solid fa-futbol" style="font-size: 36px; color: #059669;"></i>
            <h2>Đăng Nhập</h2>
            <p style="font-size: 13px; color: #6b7280;">Hệ thống đặt sân & quản lý sân</p>
        </div>

        <div th:if="${param.error}" class="alert alert-error">Sai tên tài khoản hoặc mật khẩu!</div>
        <div th:if="${param.registered}" class="alert alert-success">Đăng ký thành công! Hãy đăng nhập.</div>
        <div th:if="${param.logout}" class="alert alert-success">Đã đăng xuất an toàn.</div>

        <form th:action="@{/perform_login}" method="post">
            <div class="form-group">
                <label>Tên đăng nhập / Email</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="username" placeholder="Nhập tài khoản (admin)" required>
                </div>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" placeholder="Nhập mật khẩu (admin123)" required>
                </div>
            </div>

            <button type="submit" class="btn-auth">Đăng Nhập</button>
        </form>

        <div class="auth-footer">
            Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a><br>
            <a th:href="@{/}" style="margin-top: 10px; display: inline-block;">&larr; Về trang chủ</a>
        </div>
    </div>
</body>
</html>
