<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Hàng Thành Công — SÂN THẢO</title>

    <!-- Google Font & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased flex items-center justify-center h-screen m-0">

    <div class="bg-white rounded-3xl border border-slate-200/90 shadow-xl p-8 max-w-md w-full text-center mx-4">
        <!-- Icon thành công -->
        <div class="w-16 h-16 rounded-2xl bg-emerald-50 border border-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-5 text-2xl shadow-soft">
            <i class="fa-solid fa-check"></i>
        </div>

        <h1 class="text-xl font-extrabold text-slate-900 mb-2">Đặt Hàng Thành Công!</h1>
        <p class="text-xs text-slate-500 mb-6 leading-relaxed">
            Cảm ơn bạn đã tin tưởng và mua sắm tại hệ thống của chúng tôi. Đơn hàng của bạn đã được ghi nhận thành công.
        </p>

        <!-- Nút điều hướng -->
        <div class="space-y-2.5">
            <a th:href="@{/mua-ban}" 
               class="w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-md transition-colors inline-flex items-center justify-center gap-2">
                <i class="fa-solid fa-store text-[11px]"></i>
                <span>Tiếp tục mua sắm</span>
            </a>
            <a th:href="@{/}" 
               class="w-full py-3 px-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold transition-colors inline-flex items-center justify-center gap-2">
                <i class="fa-solid fa-house text-[11px]"></i>
                <span>Về trang chủ</span>
            </a>
        </div>
    </div>

</body>
</html>
