<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cài đặt hệ thống — SportHub Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f5f9; display: flex; height: 100vh; overflow: hidden; }
        .admin-sidebar { width: 250px; background: #064e3b; color: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-brand { padding: 24px 20px; font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; color: #34d399; }
        .sidebar-menu { list-style: none; padding: 10px 0; flex: 1; }
        .menu-item a { display: flex; align-items: center; gap: 12px; padding: 14px 24px; color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 600; }
        .menu-item a:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .menu-item a.active { background: rgba(255,255,255,0.14); color: #fff; border-left: 4px solid #34d399; }
        .admin-main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .top-navbar { height: 60px; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; }
        .dashboard-content { padding: 28px 32px; }
        .settings-card { background: #fff; border-radius: 14px; border: 1px solid #e5e7eb; padding: 28px; max-width: 650px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
        .btn-save { background: #059669; color: #fff; border: none; padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <aside class="admin-sidebar">
        <div class="sidebar-brand"><i class="fa-solid fa-shield-halved"></i> SportHub Admin</div>
        <ul class="sidebar-menu">
            <li class="menu-item"><a th:href="@{/admin/dashboard}"><i class="fa-solid fa-chart-pie"></i> Tổng quan</a></li>
            <li class="menu-item"><a th:href="@{/admin/courts}"><i class="fa-solid fa-store"></i> Quản lý sân bãi</a></li>
            <li class="menu-item"><a th:href="@{/admin/bookings}"><i class="fa-solid fa-calendar-check"></i> Đơn đặt sân</a></li>
            <li class="menu-item"><a th:href="@{/admin/users}"><i class="fa-solid fa-users"></i> Khách hàng &amp; Chủ sân</a></li>
            <li class="menu-item"><a th:href="@{/admin/reports}"><i class="fa-solid fa-money-bill-trend-up"></i> Báo cáo doanh thu</a></li>
            <li class="menu-item"><a th:href="@{/admin/settings}" class="active"><i class="fa-solid fa-gear"></i> Cài đặt hệ thống</a></li>
        </ul>
        <div style="padding: 20px 24px; border-top: 1px solid rgba(255,255,255,0.08);">
            <a th:href="@{/logout}" style="color: #fca5a5; text-decoration: none; font-size: 13.5px; font-weight: 600;"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</a>
        </div>
    </aside>

    <div class="admin-main">
        <header class="top-navbar">
            <span style="font-size: 15px; font-weight: 700;">Cấu Hình &amp; Cài Đặt Hệ Thống Sàn</span>
            <span style="color: #064e3b; font-weight: 700; font-size: 13.5px;"><i class="fa-solid fa-circle-user"></i> Admin</span>
        </header>

        <main class="dashboard-content">
            <div class="settings-card">
                <h3 style="font-size: 17px; margin-bottom: 20px; color: #0f172a;"><i class="fa-solid fa-sliders" style="color: #059669;"></i> Tham Số Sàn Thể Thao</h3>
                
                <div class="form-group">
                    <label>Tên Nền Tảng / Sàn</label>
                    <input type="text" class="form-control" value="SportHub — Đặt sân thể thao toàn quốc">
                </div>

                <div class="form-group">
                    <label>Tỷ Lệ Chiết Khấu / Hoa Hồng Mặc Định Thu Chủ Sân (%)</label>
                    <input type="number" class="form-control" value="8.0" step="0.5">
                </div>

                <div class="form-group">
                    <label>Số Tiền Cọc Tối Thiểu Khi Khách Đặt Giữ Sân (%)</label>
                    <input type="number" class="form-control" value="30">
                </div>

                <div class="form-group">
                    <label>Thời Gian Hủy Sân Cho Phép Hoàn Cọc (Giờ trước trận)</label>
                    <input type="number" class="form-control" value="6">
                </div>

                <button class="btn-save"><i class="fa-solid fa-floppy-disk"></i> Lưu Cấu Hình Sàn</button>
            </div>
        </main>
    </div>
</body>
</html>
