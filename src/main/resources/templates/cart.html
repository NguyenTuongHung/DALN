<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng của tôi — SânThảo Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #064e3b;
            --accent: #ea580c;
            --bg-light: #f8fafc;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
        }

        body { background: var(--bg-light); font-family: 'Inter', sans-serif; color: var(--text-main); margin: 0; padding: 0; }
        
        header { background: var(--primary-dark); color: #fff; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        header a { color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .cart-card { background: #fff; border-radius: 16px; padding: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        
        .cart-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #f1f5f9; gap: 15px; }
        .cart-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border-color); }
        
        .btn-remove { background: #fee2e2; color: #b91c1c; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; transition: background 0.2s; }
        .btn-remove:hover { background: #fecaca; }

        .btn-checkout { background: var(--primary); color: #fff; border: none; padding: 14px 28px; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 4px 12px rgba(5,150,105,0.25); transition: background 0.2s; }
        .btn-checkout:hover { background: #047857; }
    </style>
</head>
<body>

    <header>
        <a th:href="@{/mua-ban}"><i class="fa-solid fa-arrow-left"></i> Quay lại Chợ mua bán</a>
        <span style="font-weight: 800; letter-spacing: 0.5px;">GIỎ HÀNG CỦA BẠN</span>
        <a th:href="@{/}"><i class="fa-solid fa-house"></i> Trang chủ</a>
    </header>

    <div class="container">
        <div class="cart-card">
            <h2 style="margin-top: 0; color: var(--primary-dark); font-size: 22px; display: flex; align-items: center; gap: 10px;">
                <i class="fa-solid fa-cart-shopping"></i> Danh sách sản phẩm đã chọn
            </h2>
            <hr style="border:0; border-top:1px solid #e2e8f0; margin-bottom: 20px;">
            
            <!-- Khu vực hiển thị danh sách sản phẩm -->
            <div id="cartItemsContainer"></div>

            <!-- Tổng kết thanh toán -->
            <div id="cartSummary" style="margin-top: 25px; text-align: right; display: none;">
                <h3 style="margin-bottom: 15px; font-size: 18px;">Tổng thanh toán: <span id="cartTotalPrice" style="color: var(--accent); font-size: 22px;">0 đ</span></h3>
                <button type="button" class="btn-checkout" onclick="checkoutOrder()">
                    <i class="fa-solid fa-bag-shopping"></i> Tiến hành thanh toán
                </button>
            </div>
        </div>
    </div>

    <script>
        function loadCart() {
            const container = document.getElementById('cartItemsContainer');
            const summary = document.getElementById('cartSummary');
            
            // Đọc đúng key 'sporthub_cart' được lưu từ trang chi tiết
            let cart = JSON.parse(localStorage.getItem('sporthub_cart') || '[]');

            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px 0; color: var(--text-sub);">
                        <i class="fa-solid fa-cart-arrow-down" style="font-size: 48px; margin-bottom: 15px; color: #cbd5e1;"></i>
                        <p style="font-size: 16px; font-weight: 600;">Giỏ hàng của bạn đang trống!</p>
                        <a href="/mua-ban" style="display:inline-block; margin-top:10px; background:var(--primary); color:#fff; padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:600;">Khám phá chợ ngay</a>
                    </div>
                `;
                summary.style.display = 'none';
                return;
            }

            summary.style.display = 'block';
            let total = 0;

            cart.forEach((item, index) => {
                let priceNum = parseInt(String(item.price).replace(/\D/g, '')) || 0;
                total += priceNum;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <img src="${item.image || 'https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?w=100&q=75'}" alt="Product">
                        <div>
                            <h4 style="margin: 0 0 5px 0; font-size: 15px; color: var(--text-main);">${item.title}</h4>
                            <span style="color: var(--accent); font-weight: 800; font-size: 15px;">${item.price}</span>
                            <div style="font-size: 12px; color: var(--text-sub); margin-top: 4px;"><i class="fa-solid fa-location-dot"></i> ${item.location || 'Toàn quốc'}</div>
                        </div>
                    </div>
                    <button type="button" class="btn-remove" onclick="removeItem(${index})">
                        <i class="fa-solid fa-trash"></i> Xóa
                    </button>
                `;
                container.appendChild(itemDiv);
            });

            document.getElementById('cartTotalPrice').innerText = total.toLocaleString('vi-VN') + ' đ';
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('sporthub_cart') || '[]');
            cart.splice(index, 1);
            localStorage.setItem('sporthub_cart', JSON.stringify(cart));
            loadCart();
        }

        function checkoutOrder() {
            let cart = JSON.parse(localStorage.getItem('sporthub_cart') || '[]');
            if (cart.length === 0) {
                alert('Giỏ hàng của bạn đang trống!');
                return;
            }

            // Lấy thời gian thực tế hiện tại
            const now = new Date();
            const timeString = now.toLocaleDateString('vi-VN') + ' ' + now.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});

            // Đọc lịch sử mua hàng cũ hoặc khởi tạo mới
            let purchaseHistory = JSON.parse(localStorage.getItem('sporthub_purchase_history') || '[]');

            // Chuyển từng sản phẩm trong giỏ hàng thành đơn hàng chính thức
            cart.forEach(item => {
                const order = {
                    title: item.title,
                    price: item.price,
                    image: item.image || 'https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?w=100&q=75',
                    location: item.location || 'Toàn quốc',
                    time: timeString,
                    status: 'Đang giao hàng'
                };
                purchaseHistory.unshift(order); // Thêm đơn mới lên đầu danh sách
            });

            // Lưu lại vào localStorage cho phần lịch sử
            localStorage.setItem('sporthub_purchase_history', JSON.stringify(purchaseHistory));

            // Xóa sạch giỏ hàng sau khi thanh toán thành công
            localStorage.removeItem('sporthub_cart');

            alert('🎉 Thanh toán thành công! Đơn hàng của bạn đã được ghi nhận vào Lịch sử mua hàng.');
            
            // Tải lại giỏ hàng (sẽ trống) và chuyển hướng sang trang lịch sử tab mua hàng
            loadCart();
            window.location.href = '/lich-su-hoat-dong';
        }
        // Tải giỏ hàng ngay khi mở trang
        loadCart();
    </script>
</body>
</html>
