<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin nhắn với Chủ sân — Sân Thảo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f8fafc; color: #1e293b; display: flex; height: 100vh; overflow: hidden; }

        .chat-layout { flex: 1; display: grid; grid-template-columns: 320px 1fr; background: #fff; height: 100vh; overflow: hidden; }
        
        /* Cột trái: Danh sách chủ sân */
        .owner-list-panel { border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; background: #fff; }
        .panel-header { padding: 18px 16px; border-bottom: 1px solid #e2e8f0; font-weight: 700; font-size: 16px; color: #0f172a; display: flex; align-items: center; gap: 8px; }
        .owners-scroll { flex: 1; overflow-y: auto; }
        
        .owner-item { padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; transition: background 0.15s; }
        .owner-item:hover { background: #f8fafc; }
        .owner-item.active { background: #f0fdf4; border-left: 4px solid #059669; }
        
        .owner-avatar { width: 42px; height: 42px; border-radius: 50%; background: #0284c7; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0; }
        .owner-info { flex: 1; min-width: 0; }
        .owner-name { font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .owner-last-msg { font-size: 12.5px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Cột phải: Khung chat */
        .chat-room { display: flex; flex-direction: column; background: #f8fafc; height: 100%; }
        .chat-header { padding: 14px 20px; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; }
        
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 70%; padding: 10px 14px; border-radius: 10px; font-size: 13.5px; line-height: 1.4; word-break: break-word; }
        .message.customer { background: #059669; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.owner { background: #fff; color: #1e293b; align-self: flex-start; border: 1px solid #e2e8f0; border-bottom-left-radius: 2px; }
        .message-time { font-size: 10px; margin-top: 4px; opacity: 0.8; text-align: right; }

        .chat-form { padding: 14px 20px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; }
        .chat-input { flex: 1; padding: 10px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 13.5px; outline: none; }
        .chat-input:focus { border-color: #059669; box-shadow: 0 0 0 3px rgba(5,150,105,0.1); }
        .btn-send { background: #059669; color: #fff; border: none; padding: 0 20px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .btn-send:hover { background: #047857; }
    </style>
</head>
<body>

    <div class="chat-layout">
        <!-- Cột trái: Danh sách chủ sân -->
        <div class="owner-list-panel">
            <div class="panel-header">
                <i class="fa-solid fa-comments" style="color: #059669;"></i> Tin Nhắn Với Chủ Sân
            </div>
            <div class="owners-scroll" id="ownerListContainer">
                <div style="padding: 20px; text-align: center; color: #94a3b8; font-size: 13px;">Đang tải danh sách...</div>
            </div>
        </div>

        <!-- Cột phải: Khung chat chi tiết -->
        <div class="chat-room">
            <div class="chat-header">
                <div style="font-size: 15px; font-weight: 700; color: #0f172a;" id="activeOwnerName">
                    Chọn một chủ sân để bắt đầu trò chuyện
                </div>
                <a th:href="@{/}" style="font-size: 13px; color: #059669; text-decoration: none; font-weight: 600;">
                    <i class="fa-solid fa-arrow-left"></i> Về Trang chủ
                </a>
            </div>

            <div class="chat-messages" id="activeChatMessages">
                <div style="text-align: center; color: #94a3b8; margin-top: auto; margin-bottom: auto;">
                    <i class="fa-regular fa-comments" style="font-size: 36px; margin-bottom: 10px; display: block;"></i>
                    Vui lòng chọn chủ sân ở danh sách bên trái.
                </div>
            </div>

            <form class="chat-form" id="chatForm" onsubmit="sendCustomerMessage(event)" style="display: none;">
                <input type="text" id="replyContent" class="chat-input" placeholder="Nhập tin nhắn gửi chủ sân..." autocomplete="off" required>
                <button type="submit" class="btn-send"><i class="fa-solid fa-paper-plane"></i> Gửi</button>
            </form>
        </div>
    </div>

    <script>
        let selectedOwnerId = null;
        let chatInterval = null;

        function loadConversations() {
            fetch('/customer/api/conversations')
                .then(res => res.json())
                .then(owners => {
                    const container = document.getElementById('ownerListContainer');
                    if (!owners || owners.length === 0) {
                        container.innerHTML = '<div style="padding: 30px; text-align: center; color: #94a3b8; font-size: 13px;">Chưa có cuộc trò chuyện nào.</div>';
                        return;
                    }

                    let html = '';
                    owners.forEach(o => {
                        const isSelected = o.ownerId === selectedOwnerId ? 'active' : '';
                        const initial = o.ownerName ? o.ownerName.charAt(0).toUpperCase() : 'C';
                        html += `
                            <div class="owner-item ${isSelected}" onclick="selectOwner(${o.ownerId}, '${o.ownerName || 'Chủ sân'}')">
                                <div class="owner-avatar">${initial}</div>
                                <div class="owner-info">
                                    <div class="owner-name">${o.ownerName || 'Chủ sân'}</div>
                                    <div class="owner-last-msg">${o.lastMessage || 'Đã gửi tin nhắn'}</div>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                })
                .catch(err => console.log("Lỗi tải danh sách:", err));
        }

        function selectOwner(ownerId, ownerName) {
            selectedOwnerId = Number(ownerId);
            document.getElementById('activeOwnerName').innerText = `Đang chat với: ${ownerName}`;
            document.getElementById('chatForm').style.display = 'flex';

            loadMessages();
            if (chatInterval) clearInterval(chatInterval);
            chatInterval = setInterval(loadMessages, 3000);
            loadConversations();
        }

        function loadMessages() {
            if (!selectedOwnerId) return;

            fetch(`/customer/api/messages?ownerId=${selectedOwnerId}`)
                .then(res => res.json())
                .then(messages => {
                    const box = document.getElementById('activeChatMessages');
                    let html = '';
                    if (!messages || messages.length === 0) {
                        html = '<div style="text-align: center; color: #94a3b8; margin-top: auto; margin-bottom: auto;">Chưa có tin nhắn nào.</div>';
                    } else {
                        messages.forEach(m => {
                            const isCustomer = m.senderRole !== 'OWNER';
                            const timeStr = m.sentAt ? m.sentAt.substring(11, 16) : '';
                            html += `
                                <div class="message ${isCustomer ? 'customer' : 'owner'}">
                                    <div>${m.content}</div>
                                    <div class="message-time">${timeStr}</div>
                                </div>
                            `;
                        });
                    }
                    if(selectedOwnerId) {
                        box.innerHTML = html;
                        box.scrollTop = box.scrollHeight;
                    }
                })
                .catch(err => console.log("Lỗi tải tin nhắn:", err));
        }

        function sendCustomerMessage(event) {
            event.preventDefault();
            if (!selectedOwnerId) return;

            const input = document.getElementById('replyContent');
            const content = input.value.trim();
            if (!content) return;

            input.value = '';

            fetch('/customer/api/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `ownerId=${selectedOwnerId}&content=${encodeURIComponent(content)}`
            }).then(res => {
                if (res.ok) {
                    loadMessages();
                    loadConversations();
                }
            });
        }

        document.addEventListener("DOMContentLoaded", function() {
            loadConversations();
            setInterval(loadConversations, 5000);
        });
    </script>
</body>
</html>
