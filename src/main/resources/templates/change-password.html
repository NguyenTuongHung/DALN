<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu — SânThảo.vn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 550px; margin: 0 auto; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .top-nav a { text-decoration: none; color: #064e3b; font-weight: 600; font-size: 14px; }
        .card { background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.04); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        .form-control:focus { border-color: #059669; }
        .btn-change { width: 100%; background: #059669; color: #fff; border: none; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn-change:hover { background: #047857; }
        .alert-error { background: #fee2e2; color: #b91c1c; padding: 10px 14px; border-radius: 8px; font-size: 13.5px; margin-bottom: 16px; }
        .alert-success { background: #dcfce7; color: #15803d; padding: 10px 14px; border-radius: 8px; font-size: 13.5px; margin-bottom: 16px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <a th:href="@{/}"><i class="fa-solid fa-arrow-left"></i> Về trang chủ</a>
        <div style="display: flex; gap: 16px;">
            <a th:href="@{/profile}">Hồ sơ</a>
            <a th:href="@{/lich-su-dat-san}">Lịch sử đặt</a>
        </div>
    </div>

    <div class="card">
        <h2 style="font-size: 20px; color: #0f172a; margin-bottom: 6px;"><i class="fa-solid fa-lock" style="color: #059669;"></i> Đổi mật khẩu</h2>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 20px;">Đảm bảo mật khẩu của bạn có ít nhất 6 ký tự để bảo mật.</p>

        <div th:if="${error}" class="alert-error" th:text="${error}"></div>
        <div th:if="${success}" class="alert-success" th:text="${success}"></div>

        <form th:action="@{/doi-mat-khau}" method="post">
            <div class="form-group">
                <label>Mật khẩu hiện tại</label>
                <input type="password" name="oldPassword" class="form-control" placeholder="Nhập mật khẩu đang dùng" required>
            </div>

            <div class="form-group">
                <label>Mật khẩu mới</label>
                <input type="password" name="newPassword" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
            </div>

            <div class="form-group">
                <label>Xác nhận mật khẩu mới</label>
                <input type="password" name="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu mới" required>
            </div>

            <button type="submit" class="btn-change">Cập nhật mật khẩu</button>
        </form>
    </div>
</div>

</body>
</html>
